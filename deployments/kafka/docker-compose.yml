version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      #map du lieu zookeeper ra ngoai de khong bi mat khi restart container
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log
    networks:
      - data-network

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      #cau hinh de may that ket noi duoc voi kafka trong docker
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      #map du lieu kafka ra may that de khong bi mat khi restart container
      - ./data/kafka:/var/lib/kafka/data
    
    networks:
      - data-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    depends_on:
      - broker
    networks:
      - data-network
  producer:
    build: 
      context: ../../
      dockerfile: deployments/kafka/Dockerfile
    container_name: tiki_producer
    command: python scripts/data_generator/kafka_producer.py
    restart: always
    depends_on:
      - broker
    
    env_file:
      - ../../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    networks:
      - data-network

  consumer:
    build: 
      context: ../../
      dockerfile: deployments/kafka/Dockerfile
    container_name: tiki_consumer
    command: python src/streaming/kafka_to_gcs_consumer.py
    restart: always
    depends_on:
      - broker
    env_file:
      - ../../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      GCS_BUCKET: ${BUCKET_NAME}
      PROJECT_ID: ${PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/ecommerce-sa.json
    
    volumes:
      - ../../secrets:/app/secrets
    networks:
      - data-network
networks:
  data-network:
    external: true
